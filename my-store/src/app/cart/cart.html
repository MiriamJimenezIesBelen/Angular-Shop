<h3>Cart</h3>

<p>
  <a routerLink="/shipping">Shipping Prices</a>
</p>

<div class="cart-item" *ngFor="let item of items">
  <span class="item-name">{{ item.name }}</span>
  <div class="item-right">
    <span class="item-price">{{ item.price | currency }}</span>
    <div class="qty-controls">
      <button class="qty-btn" (click)="decrease(item)">−</button>
      <span class="qty-value">{{ item.quantity }}</span>
      <button class="qty-btn" (click)="increase(item)">+</button>
    </div>
    <span class="item-total">{{ item.price * item.quantity | currency }}</span>
  </div>
</div>

<p class="empty-cart" *ngIf="items.length === 0">Your cart is empty.</p>

<form [formGroup]="checkoutForm" (ngSubmit)="onSubmit()">
  <div class="form-field">
    <label for="name">NAME</label>
    <input id="name" type="text" formControlName="name">
  </div>

  <div class="form-field">
    <label for="address">ADDRESS</label>
    <input id="address" type="text" formControlName="address">
  </div>

  <button class="purchase-button" type="submit">Purchase</button>
</form>
